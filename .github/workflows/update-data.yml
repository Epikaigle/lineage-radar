name: Publish Lineage Radar to Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "logo.svg"
      - "robots.txt"
      - "sitemap.xml"
      - ".nojekyll"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Read-only access to repository content; no automated git commits or pushes.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lineage-radar-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site and collector
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Collect current official LineageOS data
        run: python scripts/update_data.py

      - name: Assemble the website artifact
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css logo.svg robots.txt sitemap.xml .nojekyll _site/
          cp data/devices.json _site/data/devices.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (without committing generated data)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
