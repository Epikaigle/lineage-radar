name: Refresh LineageOS data

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lineage-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Refresh LineageOS data
        run: python scripts/update_data.py

      - name: Commit data only when it changed
        run: |
          if git diff --quiet -- data/devices.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/devices.json
          git commit -m "chore: refresh LineageOS device data"
          git pull --rebase origin main
          git push
